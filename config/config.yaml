# ==========================================================================
# Extremolith (Extremophilic Protein Translator) - central configuration
# All paths, thresholds, and conventions for the GTDB -> bin -> secrete pipeline.
# Paths under `biotite:` are on the SLURM cluster; `local:` are workspace-relative.
# ==========================================================================

gtdb:
  release: "r232"                       # verified on biotite 2026-07-07

# --------------------------------------------------------------------------
# On-cluster (biotite) data layout. Verified against the filesystem.
# --------------------------------------------------------------------------
biotite:
  host: "ssh:biotite"
  base: "/groups/cress/projects/jaymin/IS1111"
  gtdb_dir: "/groups/cress/projects/jaymin/IS1111/gtdb"
  work_dir: "/groups/cress/projects/jaymin/IS1111/work"
  scratch_root: "/groups/cress/projects/jaymin/eptrans_scratch"   # pipeline outputs (VAST /groups)

  # Persistent project home for durable products moved out of scratch (2026-07-09).
  persist_root: "/groups/cress/projects/jaymin/IS1111/eptrans"
  # 199,923-genome GenomeSPOT environmental predictions (moved from scratch_root).
  genomespot_predictions: "/groups/cress/projects/jaymin/IS1111/eptrans/genomespot_predictions_r232.tsv"

  # Reference databases for the function-retention oracle (moved from scratch/db).
  # Shared, system-wide DBs stay under /shared/db; project-staged ones under db_root.
  db_root: "/groups/cress/projects/jaymin/IS1111/eptrans/db"
  ref_dbs:
    uniref50:        "/shared/db/uniref/uniref50/latest/uniref50.fasta"          # 2025-11-13
    uniprot_mmseqs:  "/shared/db/uniprot/latest/mmseqs/"                         # 2025_01
    pfam_hmm:        "/shared/db/pfam/latest/Pfam-A.hmm"                         # r37
    foldseek_pdb:    "/shared/db/foldseek/latest/db/pdb"                        # 2026-02-04
    foldseek_af:     "/shared/db/foldseek/latest/db/alphafold_uniprot"         # 2026-02-04
    swissprot_dat:   "/groups/cress/projects/jaymin/IS1111/eptrans/db/swissprot_2026_07_09/uniprot_sprot.dat.gz"  # 2026_02
    interpro_entries: "/groups/cress/projects/jaymin/IS1111/eptrans/db/interpro_2026_07_09/entry.list"
    # --- Generation-time MSA databases (§10) — shared, read-only; do NOT copy ---
    # For `mmseqs easy-search` conservation MSA use uniprot_kb (a true mmseqs2 seq DB).
    # CAUTION: /shared/db/uniclust/30_2020_06 is an HH-suite DB (_a3m/_cs219/_hhm
    # .ffdata) for hhblits, NOT usable by mmseqs — the old "uniref30_mmseqs" label was
    # wrong (verified 2026-07-13: mmseqs easy-search against it returns 0 hits).
    msa_mmseqs: "/shared/db/uniprot/latest/mmseqs/uniprot_kb"                      # mmseqs2 UniProtKB seq DB (default MSA target)
    colabfold_envdb: "/shared/db/colabfold/latest/colabfold_envdb_202108_db"      # ColabFold envdb 202108 (mmseqs profile DB — deeper MSA protocol)
    uniref30_hhblits: "/shared/db/uniclust/30_2020_06"                            # HH-suite DB (hhblits only, NOT mmseqs)
    # InterPro position mapping via mcp-protein-annotation connector (protein2ipr not staged)
    # M-CSA: repo artifact data/mcsa_snapshot/mcsa_catalytic_residues.tsv (API snapshot 2026-07-09)

  metadata:
    bacteria: "/groups/cress/projects/jaymin/IS1111/gtdb/bac120_metadata_r232.tsv.gz"
    archaea:  "/groups/cress/projects/jaymin/IS1111/gtdb/ar53_metadata_r232.tsv.gz"

  # Per-genome Prodigal proteomes: <prefix>_<acc>_protein.faa.gz, prefix retained.
  protein_faa_reps: "/groups/cress/projects/jaymin/IS1111/gtdb/protein_faa_reps"   # {archaea,bacteria}/

  # Genome nucleotide FASTAs, 3-level nested under database/{GCA,GCF}/NNN/NNN/NNN/
  genomes_root: "/groups/cress/projects/jaymin/IS1111/gtdb/gtdb_genomes_reps_r232/database"

  # Pre-built work products (see conventions below).
  combined_faa:     "/groups/cress/projects/jaymin/IS1111/work/gtdb_reps.faa"       # >{GENOME}~{PROTID}
  protein_coords:   "/groups/cress/projects/jaymin/IS1111/work/protein_coords.tsv.gz"
  genome_index:     "/groups/cress/projects/jaymin/IS1111/work/genome_index.tsv"    # headerless: <bare_acc>\t<abs_path>

  scratch: "/groups/cress/projects/jaymin/IS1111/work/eptrans"    # pipeline outputs on cluster

# --------------------------------------------------------------------------
# Data conventions (verified). Documented here so the code is auditable.
# --------------------------------------------------------------------------
conventions:
  # genome id keeps GTDB source prefix: GB_ (GenBank/GCA) or RS_ (RefSeq/GCF)
  genome_prefixes: ["GB_", "RS_"]
  # combined FASTA header: >{GENOME}~{PROTID}  e.g. >GB_GCA_000008085.1~AE017199.1_1
  faa_header_sep: "~"
  # protein_coords.tsv.gz columns:
  coords_columns: ["tagged_id", "genome", "accession", "contig", "start", "end", "strand"]
  # metadata representative flag (column 19): gtdb_representative == 't'
  representative_flag_col: "gtdb_representative"
  representative_flag_value: "t"

# --------------------------------------------------------------------------
# Metadata columns used downstream (from the 113-col bac120 / ar53 TSVs).
# --------------------------------------------------------------------------
metadata_columns:
  accession: "accession"
  gtdb_taxonomy: "gtdb_taxonomy"
  ncbi_taxonomy: "ncbi_taxonomy"
  isolation_source: "ncbi_isolation_source"     # primary environment proxy
  organism_name: "ncbi_organism_name"
  strain: "ncbi_strain_identifiers"
  country: "ncbi_country"
  checkm_completeness: "checkm2_completeness"
  checkm_contamination: "checkm2_contamination"

# QC filters applied to representatives before use.
qc:
  min_completeness: 90.0
  max_contamination: 5.0

# --------------------------------------------------------------------------
# Environmental binning thresholds (GenomeSPOT predicted optima).
# Units: temperature °C, pH unitless, salinity % w/v NaCl.
# --------------------------------------------------------------------------
thresholds:
  temperature:
    psychrophile_max_opt: 15.0
    thermophile_min_opt: 50.0
    hyperthermophile_min_opt: 80.0
  ph:
    acidophile_max_opt: 5.0
    alkaliphile_min_opt: 9.0
  salinity:
    halophile_min_opt: 5.0        # % w/v NaCl
  # Mesophile envelope (used to call a genome confidently non-extreme).
  mesophile:
    temp_min_opt: 20.0
    temp_max_opt: 40.0
    ph_min_opt: 6.0
    ph_max_opt: 8.0
    salinity_max_opt: 3.0

# --------------------------------------------------------------------------
# Confidence-combination scheme (metadata proxy x GenomeSPOT prediction).
# --------------------------------------------------------------------------
combination:
  high_confidence: "metadata_and_prediction_agree"
  medium_confidence: "prediction_only"
  low_confidence: "metadata_only_or_conflict"

# --------------------------------------------------------------------------
# GenomeSPOT
# --------------------------------------------------------------------------
genomespot:
  repo: "https://github.com/cultivarium/GenomeSPOT.git"
  env: "genomespot"
  # Precomputed predictions from the GenomeSPOT publication (older GTDB release).
  # Resolved at reconciliation time; fill in once located.
  precomputed_url: null
  precomputed_local: "data/genomespot_precomputed"

# --------------------------------------------------------------------------
# SignalP 6.0 (installed & in PATH on biotite)
# --------------------------------------------------------------------------
signalp:
  binary: "signalp6"
  mode: "fast"
  organism: "other"
  partition: "standard"
  # Signal-peptide classes reported by SignalP 6.0
  sp_classes: ["SP", "LIPO", "TAT", "TATLIPO", "PILIN"]   # Sec/SPI, Sec/SPII, Tat/SPI, Tat/SPII, Sec/SPIII

# --------------------------------------------------------------------------
# Phylogenetically-controlled selection
# --------------------------------------------------------------------------
selection:
  max_per_lineage_rank: "family"     # cap extremophile picks per this rank for diversity
  max_per_lineage: 5                 # max extremophiles drawn from any one lineage-rank group
  max_total_per_class: 100           # cap selected extremophiles per class (null = no cap)
  # Cap genomes drawn from any ONE environmental sample. MAG labels are
  # sample-level: the deep-sea set is 4,084 MAGs from 858 samples, and the
  # per-family cap cannot control this because co-occurring bins from one sample
  # are phylogenetically diverse by construction (worst sample: 38 thermophile
  # MAGs across 30 families). Measured on the merged 204,007-row table,
  # thermophile MAG extremophiles by cap:
  #   None -> 423 MAGs / 112 samples / worst sample 21 / 4,994 pairs
  #   5    -> 302 MAGs / 117 samples / worst sample  5 / 4,927 pairs
  #   2    -> 192 MAGs / 120 samples / worst sample  2 / 4,868 pairs
  # 5 cuts worst-case replication 4x (21->5) for 1.3% of total pairs, and raises
  # the sample count because freed slots go to other samples. Set to 5 rather
  # than a new number so there is one diversity convention, not two. Other
  # classes retain 100%: they never had multiple MAGs per sample.
  # NULL is a no-op, verified identical on the GTDB-only baseline.
  max_per_sample: 5
  sample_col: "source_sample_id"     # blank = isolate genome (its own sample), exempt
  outgroup_match_rank: "genus"       # try nearest mesophile at this rank, then walk up
  outgroup_match_fallback_ranks: ["family", "order", "class"]

# --------------------------------------------------------------------------
# Dataset assembly
# --------------------------------------------------------------------------
dataset:
  mmseqs_min_seq_id: 0.5
  mmseqs_coverage: 0.8
  splits: { train: 0.8, val: 0.1, test: 0.1 }
  split_seed: 1466

  # Redundancy cap on ortholog pairs, applied per (cluster, phenotype class).
  # null = uncapped, which reproduces the r232 baseline exactly (90,984 pairs).
  #
  # Only binds under whole_proteome scope, where core families (Bac120, ribosome,
  # tRNA synthetases, RNAP, chaperones) sit at prevalence f~1.0 and each intersect
  # EVERY matched genome pair. On the secreted set the maximum observed prevalence
  # is 849/7,268 genomes (11.7%) and the largest single cluster contributes 201
  # pairs, so any k >= 200 is a no-op.
  #
  # Caps redundancy, NOT information: thermophile EF-Tu vs mesophile EF-Tu is a
  # genuine thermostability contrast and must be kept. Do NOT instead filter
  # clusters by prevalence — that deletes exactly the conserved-fold signal that
  # whole_proteome scope exists to capture.
  #
  # Stratification by class is load-bearing. Matched genome pairs are imbalanced
  # (halophile 1,472 / thermophile 560 / acidophile 341 / alkaliphile 292 /
  # hyperthermophile 22). Measured on the r232 baseline (169 hyperthermophile
  # pairs uncapped), the stratified cap holds all 169 down to k=3 and first loses
  # pairs at k=2 (167); the unstratified cap is already at 163 by k=10, 134 at
  # k=3, and 76 at k=1.
  #
  # MEASURED on biotite job 1162872 (158 genomes, 323,178 proteins, mmseqs
  # easy-cluster at the production 50% id / 80% cov -> 224,022 clusters):
  #
  #   max prevalence f = 108/158 = 0.684. ZERO clusters above f=0.70.
  #   8 clusters at f>=0.50; 49 in 0.25-0.50; 98.96% of clusters below f=0.05;
  #   83.7% singletons.
  #
  # This REFUTES the f~1.0 core-family assumption used to size this cap earlier
  # (assumed 120 families at f=1.00, 480 at 0.90, 1500 at 0.50 -- none of those
  # strata exist). At 50% identity the universal families fragment into many
  # sub-family clusters rather than forming single pan-genome clusters, so no
  # cluster spans even three-quarters of genomes.
  #
  # Measured yield, 73 matched pairs from the same clustering: 25,580 protein
  # pairs, i.e. 5.6x (hyperthermophile) to 26x (acidophile) the secreted
  # pairs-per-genome-pair rate. Four of the five classes EXCEED the 8.9x naive
  # protein-count ratio (halophile 12.5x, thermophile 12.0x, alkaliphile 20.4x,
  # acidophile 26.0x) because cytoplasmic proteins are more conserved and recover
  # more orthologs per genome pair. HYPERTHERMOPHILE IS THE EXCEPTION at 5.6x,
  # BELOW the naive ratio -- its probe estimate rests on only 15 genome pairs
  # (22 in production), so it is both the least precise and the class where the
  # whole-proteome payoff is smallest. Do not generalise the other four to it.
  # Projected to production genome-pair counts: ~1.24M pairs vs 90,984 secreted.
  #
  # Cap sizing is NOT yet settled. The probe's largest (cluster, class) cell was
  # 17, exactly its largest class size -- so cell size is bounded by the number
  # of genome pairs in the class, not by anything intrinsic. At production scale
  # the ceiling is therefore the class size itself (halophile 1,472). Set k as a
  # FRACTION of each class's genome-pair count, not as an absolute integer; a
  # single global k would bind very differently on halophile (1,472 pairs) than
  # on hyperthermophile (22).
  max_pairs_per_cluster_class: null

  # Per-phenotype protein scope (added 2026-07-30).
  #
  # Rationale: pH and salinity are properties of the EXTRACELLULAR medium. A
  # cytoplasmic protein in an acidophile sits at near-neutral pH (acidophiles
  # maintain cytoplasmic pH ~6.5 against a >2-unit gradient), and a halophile
  # using the salt-out strategy keeps its cytoplasm low-salt. So for those
  # classes the adaptive signal really is concentrated in the secretome, and
  # restricting to it improves the signal-to-noise ratio.
  #
  # Temperature is not compartmentalised. Heat and cold penetrate the cell;
  # every protein in a hyperthermophile must fold and function at 80 C+.
  # Restricting to the secretome therefore discards ~89% of the informative
  # sequence for no biophysical reason, and it is exactly the thermal classes
  # that are pair-starved (hyperthermophile: 169 protein pairs from 22 genome
  # pairs; validation AUPRC 0.898 rests on 23 pairs).
  #
  # SignalP retains 11.28% of proteins (1,985,508 / 17,603,649 in r232), so
  # whole-proteome scope is an ~8.9x increase in candidate sequence.
  protein_scope:
    default: secreted
    by_phenotype:
      halophile:        secreted
      acidophile:       secreted
      alkaliphile:      secreted
      hyperthermophile: whole_proteome
      psychrophile:     whole_proteome
      # thermophile: DECIDED `secreted` (via the default above), 2026-08-04.
      # The same biophysical argument for whole-proteome applies (temperature is
      # not compartmentalised), and the concern that originally held this open --
      # that a few huge protein clusters would dominate whole-proteome pairs --
      # HAS since been resolved two ways:
      #   (1) measured prevalence spectrum over 158 genomes / 224,022 clusters:
      #       max cluster prevalence f = 108/158 = 0.684, with ZERO clusters
      #       above f = 0.70. At 50% identity the universal families fragment
      #       into sub-family clusters instead of forming one pan-genome cluster,
      #       so the "one cluster intersects every genome pair" worst case does
      #       not occur.
      #   (2) `max_pairs_per_cluster_class` (class-stratified) is implemented and
      #       tested, so even a pathological cluster is bounded per class.
      # The user nonetheless chose to keep thermophile secreted: at 4,927 matched
      # genome pairs, whole-proteome scope would add roughly 1M protein pairs and
      # make thermophile ~90% of the dataset, and the extra data is not needed.
      # This is a deliberate balance decision, NOT an unresolved question --
      # do not re-open it without a new reason.

# --------------------------------------------------------------------------
# SLURM defaults
# --------------------------------------------------------------------------
slurm:
  account: null
  partition_cpu: "standard"
  partition_highmem: "memory"
  partition_gpu: "gpu"

# --------------------------------------------------------------------------
# Modeling (design doc Section 11-13): shared LoRA-adapted ESM-2 backbone,
# two heads, §12 losses, §13 conservation-weighted masking.
# --------------------------------------------------------------------------
modeling:
  backbone_size: "3B"              # ESM-2 t36 (chosen); 35M/150M for CPU smoke-tests
  lora_rank: 32                    # bumped for multi-residue coupling capacity (S15 #3)
  lora_alpha: 64
  full_attention: true             # LoRA on query/key/value + attention-output dense
  bucket_by_length: true           # length-bucket batches to cut padding waste (~2-3x fewer tokens)
  lora_dropout: 0.05
  max_len: 1022                    # ESM-2 context; longer mature chains truncated
  mlm:
    epochs: 3
    lr: 1.0e-4
    mask_rate: 0.15                # BERT 80/10/10
    gamma: 1.0                     # conservation-mask exponent (uniform until MSA available)
    coupling_mode: null            # null|span|contact|both — mask coupled units jointly (S15 #1)
    span_len: 3                    # span-mode block length (local secondary structure)
    contact_threshold: 0.5         # ESM-2 contact-head prob to call a coupled pair
    contact_min_sep: 6             # min residue separation for a contact pair
    overlap: 256                   # sliding-window overlap for >max_len chains (truncation guard)
    beta_kl: 0.0                   # forgetting-guard off by default
  classifier:
    epochs: 5
    lr_head: 1.0e-3
    lr_adapter: 1.0e-5
    lam: 1.0                       # weight on the matched-pair margin term
    margin: 1.0
    select_metric: "auprc"         # model-select / early-stop on val AUPRC
    neg_per_pos: 3.0               # cap negatives at 3x positives (bounds Stage-2 wall-clock)
  confidence_weights: { high: 1.0, medium: 0.5, none: 1.0, low: 0.25 }
