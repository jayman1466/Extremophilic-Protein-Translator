<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Extremophilic Protein Translator{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/theme.css') }}" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg ept-navbar">
    <div class="container">
      <a class="navbar-brand" href="{{ url_for('index') }}">
        <img src="{{ url_for('static', filename='img/logo.svg') }}" alt="Extremolith"
             class="ept-logo"
             onerror="this.style.display='none';this.nextElementSibling.style.display='inline';">
        <span class="brand-text" style="display:none">Extremophilic&nbsp;Protein&nbsp;Translator</span>
      </a>
      <div class="ms-auto">
        <a class="nav-btn me-2" href="{{ url_for('index') }}">New Job</a>
        <a class="nav-btn" href="{{ url_for('jobs') }}">Jobs</a>
      </div>
    </div>
  </nav>
  <main class="container py-4">
    {% block content %}{% endblock %}
  </main>
  <footer class="text-center text-muted py-3 small">
    Enzyme scaffold engineering &mdash; secreted extremophile proteins from GTDB
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
