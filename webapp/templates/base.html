<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Extremophilic Protein Translator{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/theme.css') }}" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg ept-navbar">
    <div class="container">
      <a class="navbar-brand" href="{{ url_for('index') }}">
        <img src="{{ url_for('static', filename='img/logo.svg') }}" alt="Extremolith"
             class="ept-logo"
             onerror="this.style.display='none';this.nextElementSibling.style.display='inline';">
        <span class="brand-text" style="display:none">Extremophilic&nbsp;Protein&nbsp;Translator</span>
      </a>
      <div class="ms-auto d-flex align-items-center">
        <a class="nav-btn me-2" href="{{ url_for('index') }}">New Job</a>
        <a class="nav-btn me-2" href="{{ url_for('jobs') }}">Jobs</a>
        <a class="nav-btn" href="https://github.com/jayman1466/Extremophilic-Protein-Translator"
           target="_blank" rel="noopener" title="View source on GitHub" aria-label="GitHub repository">
          <svg width="20" height="20" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true" style="vertical-align:-3px">
            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
          </svg>
        </a>
      </div>
    </div>
  </nav>
  <main class="container py-4">
    {% block content %}{% endblock %}
  </main>
  <footer class="text-center text-muted py-3 small">
    Contact Jaymin Patel at <a href="mailto:jayman1466@gmail.com">jayman1466@gmail.com</a> with any questions
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
